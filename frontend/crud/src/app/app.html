@if (authService.autenticado()) {
  <header class="flex items-center justify-between px-6 py-3 border-b border-gray-200 bg-white">
    <h1 class="text-lg font-semibold text-gray-900">Gerenciamento de IPs Bloqueados</h1>
    <div class="flex items-center gap-3">
      @if (authService.usuarioLogado()) {
        <span class="text-sm text-gray-600">{{ authService.usuarioLogado() }}</span>
      }
      <p-button
        label="Sair"
        icon="pi pi-sign-out"
        severity="secondary"
        size="small"
        (click)="logout()"
      />
    </div>
  </header>
}

<main class="card p-4 min-h-screen">
  <router-outlet />
</main>
