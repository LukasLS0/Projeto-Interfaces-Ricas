<div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
  <div class="px-6 py-4 border-b border-gray-100 bg-gray-50">
    <h2 class="text-lg font-medium text-gray-900">IPs Registrados</h2>
  </div>

  <p-table
    [value]="registros()"
    dataKey="id"
    styleClass="p-datatable-sm"
    responsiveLayout="scroll"
    [tableStyle]="{ width: '100%' }"
  >
    <ng-template #header>
      <tr class="bg-gray-50 border-b border-gray-200">
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wide">
          IP
        </th>
        <th
          class="px-6 py-3 text-center text-xs font-semibold text-gray-700 uppercase tracking-wide"
        >
          Tentativas
        </th>
        <th
          class="px-6 py-3 text-center text-xs font-semibold text-gray-700 uppercase tracking-wide"
        >
          Status
        </th>
        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wide">
          Origem
        </th>
        <th
          class="px-6 py-3 text-center text-xs font-semibold text-gray-700 uppercase tracking-wide"
          style="width: 10rem"
        >
          Ações
        </th>
      </tr>
    </ng-template>

    <ng-template #body let-rowData let-ri="rowIndex">
      <tr
        [ngClass]="ri % 2 === 0 ? 'bg-white' : 'bg-gray-50'"
        class="border-b border-gray-200 hover:bg-gray-100 transition-colors duration-150"
      >
        <td class="px-6 py-4 text-sm text-gray-900">{{ rowData.ip }}</td>
        <td class="px-6 py-4 text-center text-sm text-gray-900">
          <span class="font-medium text-gray-900">{{ rowData.tentativas }}</span>
        </td>
        <td class="px-6 py-4 text-center text-sm">
          <span
            [class]="
              rowData.bloqueado
                ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-50 text-red-700'
                : 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-green-50 text-green-700'
            "
          >
            <span
              [class]="
                rowData.bloqueado
                  ? 'w-2 h-2 bg-red-500 rounded-full mr-1.5'
                  : 'w-2 h-2 bg-green-500 rounded-full mr-1.5'
              "
            ></span>
            {{ rowData.bloqueado ? 'Bloqueado' : 'Ativo' }}
          </span>
        </td>
        <td class="px-6 py-4 text-sm text-gray-900">{{ rowData.origem }}</td>
        <td class="px-6 py-4 text-center">
          <div class="flex justify-center gap-1">
            <p-button
              icon="pi pi-eye"
              (click)="onDetalhar(rowData)"
              severity="secondary"
              rounded
              [text]="true"
              ariaLabel="Detalhar"
            />
            <p-button
              icon="pi pi-pencil"
              (click)="onAlterar(rowData)"
              severity="secondary"
              rounded
              [text]="true"
              ariaLabel="Alterar"
            />
            <p-button
              icon="pi pi-trash"
              (click)="onRemover(rowData.id)"
              severity="danger"
              rounded
              [text]="true"
              ariaLabel="Excluir"
            />
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <div class="px-6 py-4 border-t border-gray-100 flex justify-end ">
    <p-button label="Incluir" (click)="onIncluir()" class="w-20" />
  </div>
</div>
