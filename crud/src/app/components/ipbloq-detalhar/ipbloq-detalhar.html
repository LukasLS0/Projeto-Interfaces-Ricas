@if (registro(); as item) {
  <section class="flex mx-auto justify-center p-4">
    <div class="bg-white rounded-xl border border-gray-200 p-8 w-96 shadow-sm">
      <h2 class="text-xl font-medium text-gray-900 mb-8">Detalhes do Registro</h2>

      <div class="flex flex-col gap-4">
        <div>
          <span class="block text-sm font-medium text-gray-700 mb-1">Endereço IP</span>
          <p class="text-gray-900 text-sm">{{ item.ip }}</p>
        </div>

        <div>
          <span class="block text-sm font-medium text-gray-700 mb-1">Tentativas</span>
          <p class="text-gray-900 text-sm font-medium">{{ item.tentativas }}</p>
        </div>

        <div>
          <span class="block text-sm font-medium text-gray-700 mb-1">Status</span>
          <span
            [class]="
              item.bloqueado
                ? 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-50 text-red-700'
                : 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-green-50 text-green-700'
            "
          >
            <span
              [class]="
                item.bloqueado
                  ? 'w-2 h-2 bg-red-500 rounded-full mr-1.5'
                  : 'w-2 h-2 bg-green-500 rounded-full mr-1.5'
              "
            ></span>
            {{ item.bloqueado ? 'Bloqueado' : 'Ativo' }}
          </span>
        </div>

        <div>
          <span class="block text-sm font-medium text-gray-700 mb-1">Origem</span>
          <p class="text-gray-900 text-sm">{{ item.origem }}</p>
        </div>

        <div class="pt-6 border-t border-gray-100">
          <button
            type="button"
            (click)="onVoltar()"
            class="w-full px-4 py-2.5 bg-gray-100 text-gray-700 rounded-lg font-medium text-sm hover:bg-gray-200 transition-all duration-200"
          >
            Voltar
          </button>
        </div>
      </div>
    </div>
  </section>
}
